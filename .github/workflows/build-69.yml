name: Build 69-Continuum

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get the subreddit lists (the app links to them from a sibling folder)
        run: git clone --depth 1 https://github.com/cygnusx-1-org/subreddit-lists.git "$GITHUB_WORKSPACE/../subreddit-lists"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare signing key (same key every build, so updates install over the old app)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/my.keystore"
            printf 'storeFile=%s\nstorePassword=ytdlnis123\nkeyAlias=key0\nkeyPassword=ytdlnis123\n' "$GITHUB_WORKSPACE/my.keystore" > keystore.properties
          else
            echo "::warning::No KEYSTORE_B64 secret found. The APK will not be installable as an update."
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 69-continuum-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
